[project]
name = "shotbreak"
version = "0.1.0"
description = "AI-powered screenplay breakdown with physical description generation for consistent image prompting and MMS export"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Stephen Fingleton"},
]
keywords = ["screenplay", "film", "pre-production", "breakdown", "fountain", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "rapidfuzz>=3.0",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]
pdf = [
    "pymupdf>=1.24",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
shotbreak = "shotbreak.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
