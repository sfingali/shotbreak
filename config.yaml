# Shotbreak configuration
# API keys via environment variables: ANTHROPIC_API_KEY, ANTHROPIC_BASE_URL, etc.

providers:
  anthropic:
    kind: openai_compatible
    api_key: "placeholder"
    base_url: "http://localhost:3456/v1"
    model: "claude-opus-4"
    supports_vision: false
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
  openai:
    kind: openai_compatible
    api_key: "${OPENAI_API_KEY}"
    base_url: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
    model: "gpt-4o"
    supports_vision: true
    cost_per_1k_input: 0.0025
    cost_per_1k_output: 0.01
  deepseek:
    kind: openai_compatible
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-v4-pro"
    supports_vision: false
    cost_per_1k_input: 0.00027
    cost_per_1k_output: 0.0011

default_provider: "anthropic"

pass_models:
  metadata_synopsis: "deepseek"
  extraction_classification: "anthropic"
  coreference_llm_residual: "anthropic"
  bible_construction: "anthropic"
  scene_rendering: "anthropic"

breakdown:
  parallelism: 1
  confidence_threshold: 0.5
  max_retries: 3
  timeout_seconds: 120
